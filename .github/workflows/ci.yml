name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --no-daemon
      - name: Compile and test samples/snake
        run: ./gradlew -p samples/snake :desktop:compileJava :game:test --no-daemon

  # Playwright + system Chrome: ubuntu only (deviation from full OS matrix; macOS/Windows
  # Chrome channel is less reliable in GHA). JS+Wasm TeaVM builds and JS browser check.
  snake-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Snake web JS and Wasm
        run: ./gradlew -p samples/snake :web:gdx_teavm_web_js_build :web:gdx_teavm_web_wasm_build --no-daemon
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Playwright browser check (JS)
        working-directory: samples/snake/browser-check
        run: |
          npm ci --no-audit --no-fund
          CHROME="$(command -v google-chrome)" node check.mjs ../.worldsmiths/gen/web/build/dist/js/webapp
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snake-web-browser-evidence
          path: |
            samples/snake/browser-check/build/
          if-no-files-found: ignore
