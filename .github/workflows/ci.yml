name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # AGP validateSigningDebug can fail creating ~/.android or ~/.config/.android on GHA
      # (Ubuntu 24.04 / runner-image flakes). Pre-create both canonical debug keystores.
      - name: Ensure Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          for dir in "$HOME/.android" "$HOME/.config/.android"; do
            mkdir -p "$dir"
            ks="$dir/debug.keystore"
            if [ ! -f "$ks" ]; then
              keytool -genkeypair \
                -keystore "$ks" \
                -storepass android -keypass android \
                -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          done
      - run: ./gradlew build --no-daemon
      - name: Compile and test samples/snake
        run: ./gradlew -p samples/snake :desktop:compileJava :game:test --no-daemon
      - name: Compile and test samples/rollball
        run: ./gradlew -p samples/rollball :desktop:compileJava :game:test --no-daemon

  # Playwright + system Chrome: ubuntu only (deviation from full OS matrix; macOS/Windows
  # Chrome channel is less reliable in GHA). JS+Wasm TeaVM builds and JS browser check.
  snake-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Snake web JS and Wasm
        run: ./gradlew -p samples/snake :web:gdx_teavm_web_js_build :web:gdx_teavm_web_wasm_build --no-daemon
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Playwright browser check (JS)
        working-directory: samples/snake/browser-check
        run: |
          npm ci --no-audit --no-fund
          CHROME="$(command -v google-chrome)" node check.mjs ../.worldsmiths/gen/web/build/dist/js/webapp
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: snake-web-browser-evidence
          path: |
            samples/snake/browser-check/build/
          if-no-files-found: ignore

  # Ship archives: desktop distZip + itch-style web zip; fail closed if the assets marker is missing.
  snake-ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Snake ship archives
        run: ./gradlew -p samples/snake :desktop:distZip :web:wsItchWebZip --no-daemon
      - name: Assert ship marker in both archives
        run: |
          set -euo pipefail
          marker="ws-ship-marker.txt"
          # -print -quit avoids find|head SIGPIPE under pipefail.
          desk_zip="$(find samples/snake/.worldsmiths/gen/desktop/build/distributions -name '*.zip' -print -quit)"
          web_zip="samples/snake/.worldsmiths/gen/web/build/distributions/web-itch.zip"
          test -n "$desk_zip"
          test -f "$web_zip"
          unzip -l "$desk_zip" | grep -F "$marker"
          unzip -l "$web_zip" | grep -F "$marker"
          # unzip -l prints size/date columns before the name; allow leading whitespace.
          unzip -l "$web_zip" | grep -E '(^|[[:space:]]|/)index\.html$'
      - uses: actions/upload-artifact@v7
        with:
          name: snake-ship-archives
          path: |
            samples/snake/.worldsmiths/gen/desktop/build/distributions/*.zip
            samples/snake/.worldsmiths/gen/web/build/distributions/web-itch.zip

  # Phase-0 RoboVM-in-generated kill gate. Hard-fail if packaging fails under
  # configuration-cache must-not-fail hygiene. Fixture remains as a dedicated
  # kill-gate job; Snake ship is snake-ios below.
  ios-phase0:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Package Phase-0 generated :ios (robovmInstall + zip)
        run: >
          ./gradlew -p fixtures/ios-phase0 :ios:robovmInstall :ios:wsRobovmInstallZip
          --configuration-cache --no-daemon
          -Probovm.iosSkipSigning=true
      - name: Assert ship marker in install tree and zip
        run: |
          set -euo pipefail
          marker="ws-ship-marker.txt"
          install_dir="fixtures/ios-phase0/.worldsmiths/gen/ios/build/robovm"
          zip="fixtures/ios-phase0/.worldsmiths/gen/ios/build/distributions/ios-robovm-install.zip"
          test -d "$install_dir"
          # -print -quit avoids find|head SIGPIPE under pipefail.
          found="$(find "$install_dir" -name "$marker" -print -quit)"
          test -n "$found"
          test -f "$zip"
          unzip -l "$zip" | grep -F "$marker"
      - uses: actions/upload-artifact@v7
        with:
          name: ios-phase0-robovm-install
          path: fixtures/ios-phase0/.worldsmiths/gen/ios/build/distributions/ios-robovm-install.zip

  # Ship APK: Ubuntu assembleDebug + marker assert + upload (Dp peer of distZip / itch zip).
  # Device/emulator play is a founder manual gate — not automated here.
  snake-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      # See build job: pre-create debug keystores so validateSigningDebug is not flake-prone.
      - name: Ensure Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          for dir in "$HOME/.android" "$HOME/.config/.android"; do
            mkdir -p "$dir"
            ks="$dir/debug.keystore"
            if [ ! -f "$ks" ]; then
              keytool -genkeypair \
                -keystore "$ks" \
                -storepass android -keypass android \
                -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          done
      - name: Build Snake debug APK
        run: ./gradlew -p samples/snake :android:assembleDebug --no-daemon
      - name: Assert ship marker in debug APK
        run: |
          set -euo pipefail
          marker="ws-ship-marker.txt"
          # -print -quit avoids find|head SIGPIPE under pipefail.
          apk="$(find samples/snake/.worldsmiths/gen/android/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$apk"
          test -f "$apk"
          unzip -l "$apk" | grep -F "$marker"
      - uses: actions/upload-artifact@v7
        with:
          name: snake-android-apk
          path: samples/snake/.worldsmiths/gen/android/build/outputs/apk/debug/*.apk

  # Ship iOS: macOS robovmInstall + marker assert + zip upload (Dp peer of APK / distZip).
  # Simulator play is a founder manual gate — not automated here (CI ≠ play).
  snake-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Package Snake generated :ios (robovmInstall + zip)
        run: >
          ./gradlew -p samples/snake :ios:robovmInstall :ios:wsRobovmInstallZip
          --configuration-cache --no-daemon
          -Probovm.iosSkipSigning=true
      - name: Assert ship marker in install tree and zip
        run: |
          set -euo pipefail
          marker="ws-ship-marker.txt"
          install_dir="samples/snake/.worldsmiths/gen/ios/build/robovm"
          zip="samples/snake/.worldsmiths/gen/ios/build/distributions/ios-robovm-install.zip"
          test -d "$install_dir"
          # -print -quit avoids find|head SIGPIPE under pipefail.
          found="$(find "$install_dir" -name "$marker" -print -quit)"
          test -n "$found"
          test -f "$zip"
          unzip -l "$zip" | grep -F "$marker"
      - uses: actions/upload-artifact@v7
        with:
          name: snake-ios-robovm-install
          path: samples/snake/.worldsmiths/gen/ios/build/distributions/ios-robovm-install.zip

