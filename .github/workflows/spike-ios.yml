name: Spike S3 iOS RoboVM

on:
  push:
    branches: [spike/s3-ios-robovm]
  workflow_dispatch:

jobs:
  ios:
    name: ios (RoboVM ${{ matrix.robovm }}, release ${{ matrix.release }}, probe ${{ matrix.probe }})
    runs-on: macos-latest
    timeout-minutes: 60
    # Only the baseline must pass; the other rows are experiments whose outcome is the finding.
    continue-on-error: ${{ matrix.experiment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { robovm: "2.3.27", release: "8", probe: "none", experiment: false }
          - { robovm: "2.3.27", release: "8", probe: "java8api", experiment: true }
          - { robovm: "2.3.27", release: "11", probe: "none", experiment: true }
          - { robovm: "2.3.27", release: "17", probe: "none", experiment: true }
          - { robovm: "3.0.0", release: "8", probe: "none", experiment: true }
          - { robovm: "3.0.0", release: "11", probe: "java11", experiment: true }
          - { robovm: "3.0.0", release: "17", probe: "none", experiment: true }
    defaults:
      run:
        working-directory: spikes/ios-robovm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Toolchain versions
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          java -version
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          ./gradlew :ios:createIPA --no-daemon --stacktrace \
            -ProbovmVersion=${{ matrix.robovm }} \
            -PjavaRelease=${{ matrix.release }} \
            -Pprobe=${{ matrix.probe }} 2>&1 | tee build.log
      - name: Summarize
        if: always()
        run: |
          {
            echo "### RoboVM ${{ matrix.robovm }}, --release ${{ matrix.release }}, probe ${{ matrix.probe }}"
            echo
            ls -la ios/build/robovm/*.ipa 2>/dev/null || echo "No IPA produced."
            echo
            echo '```'
            grep -iE "warn|error|unresolved|NoClassDefFound|NoSuchMethod|unsupported|class file|StringConcat|nest" build.log | grep -v "^\s*at " | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-robovm${{ matrix.robovm }}-release${{ matrix.release }}-${{ matrix.probe }}
          path: |
            spikes/ios-robovm/ios/build/robovm/*.ipa
            spikes/ios-robovm/build.log
          if-no-files-found: warn
